monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
    handlers:
        daemon:
          type: rotating_file
          max_files: 5
          path: "%app.data_dir%/storage/files/logs/daemon.log"
          level: debug
          channels: ["daemon"]
        errors:
          type: rotating_file
          max_files: 5
          path: "%app.data_dir%/storage/files/logs/errors.log"
          level: error
          channels: ["errors"]
          formatter: monolog.formatter.errors
