# Builds the multi-user image of this fork and publishes it to the GitHub Container Registry
# of the fork's owner:
#   ghcr.io/<owner>/dreeve:multi-user        (always the latest build of feature/multi-user)
#   ghcr.io/<owner>/dreeve:multi-user-<sha>  (one tag per commit, to pin or roll back)
name: Publish multi-user image
on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-user
concurrency:
  group: multi-user-image
  cancel-in-progress: true
# Least privilege: read the code, write packages, sign the provenance attestation.
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
jobs:
  publish:
    name: Build and publish image
    # Runs in forks only, never in the original repository.
    if: github.repository_owner != 'dreeveapp'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Determine image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=multi-user
            type=sha,prefix=multi-user-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The Dockerfile installs the PHP dependencies and builds the country boundaries itself.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          file: docker/app/Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # x86 only (e.g. Proxmox). Add linux/arm64 for a Raspberry Pi, at the cost of a much slower build.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
